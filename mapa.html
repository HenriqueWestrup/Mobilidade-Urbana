<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Corrida - Mapa com Paradas e Tarifa</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #painel-controle {
            background-color: #ffcc00;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 45vh;
            overflow-y: auto;
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-row input {
            flex: 1;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        .sugestoes-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 120px;
            overflow-y: auto;
            z-index: 1100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sugestao-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        .sugestao-item:hover {
            background-color: #f8f9fa;
        }

        .btn-acao {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-acao:hover {
            background-color: #0056b3;
        }

        .btn-remover {
            background-color: #dc3545;
        }

        .btn-remover:hover {
            background-color: #bd2130;
        }

        .btn-chamar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .btn-chamar:hover {
            background-color: #218838;
        }

        /* Painel de Resumo da Tarifa */
        #resumo-viagem {
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            justify-content: space-between;
            font-weight: bold;
            color: #333;
            border-left: 4px solid #28a745;
        }

        #mapa-container {
            flex: 1;
            width: 100%;
            background-color: #e3f2fd;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Painel de Controles (Amarelo) -->
    <div id="painel-controle">
        <!-- Ponto de Embarque -->
        <div class="input-group">
            <label for="embarque">Local de Embarque (Ponto A)</label>
            <div class="input-row">
                <input type="text" id="embarque" placeholder="Detectando sua localização..." autocomplete="off">
            </div>
            <div id="sugestoes-embarque" class="sugestoes-lista"></div>
        </div>

        <!-- Container Dinâmico para Paradas Extras -->
        <div id="paradas-container"></div>

        <button class="btn-acao" onclick="adicionarParada()">+ Adicionar Parada</button>

        <!-- Destino Final -->
        <div class="input-group">
            <label for="destino">Destino Final</label>
            <div class="input-row">
                <input type="text" id="destino" placeholder="Digite o destino final..." autocomplete="off">
            </div>
            <div id="sugestoes-destino" class="sugestoes-lista"></div>
        </div>

        <!-- Resumo de Distância e Preço -->
        <div id="resumo-viagem">
            <span id="txt-distancia">Distância: --</span>
            <span id="txt-preco" style="color: #28a745;">Valor: R$ --,--</span>
        </div>

        <button class="btn-chamar" onclick="chamarMotorista()">Chamar Motorista</button>
    </div>

    <!-- Área do Mapa (Azul) -->
    <div id="mapa-container">
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // 1. Inicializar o Mapa
        const map = L.map('map').setView([-28.4833, -48.775], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let routingControl = null;
        let pontosRota = {
            embarque: null, // {lat, lon, texto}
            paradas: [],    // [{id, lat, lon, texto}]
            destino: null   // {lat, lon, texto}
        };

        let contadorParadas = 0;

        // 2. Geolocalização Inicial Automática
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                map.setView([lat, lon], 16);

                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.display_name) {
                            document.getElementById('embarque').value = data.display_name;
                            pontosRota.embarque = { lat, lon, texto: data.display_name };
                            tentarAtualizarRota();
                        }
                    });
            }, err => console.warn("Geolocalização não permitida", err));
        }

        // 3. Sistema de Autocomplete Genérico
        function configurarAutocomplete(inputElement, listaElement, callbackSelecionado) {
            let timeoutId;

            inputElement.addEventListener('input', function() {
                clearTimeout(timeoutId);
                const query = this.value;

                if (query.length < 3) {
                    listaElement.innerHTML = '';
                    return;
                }

                timeoutId = setTimeout(() => {
                    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=br&limit=5`)
                        .then(res => res.json())
                        .then(data => {
                            listaElement.innerHTML = '';
                            data.forEach(item => {
                                const div = document.createElement('div');
                                div.className = 'sugestao-item';
                                div.textContent = item.display_name;

                                div.addEventListener('click', () => {
                                    inputElement.value = item.display_name;
                                    listaElement.innerHTML = '';
                                    callbackSelecionado(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
                                });

                                listaElement.appendChild(div);
                            });
                        });
                }, 300);
            });

            document.addEventListener('click', (e) => {
                if (!inputElement.contains(e.target) && !listaElement.contains(e.target)) {
                    listaElement.innerHTML = '';
                }
            });
        }

        // Ativa autocomplete no embarque e destino fixos
        configurarAutocomplete(
            document.getElementById('embarque'),
            document.getElementById('sugestoes-embarque'),
            (lat, lon, texto) => {
                pontosRota.embarque = { lat, lon, texto };
                tentarAtualizarRota();
            }
        );

        configurarAutocomplete(
            document.getElementById('destino'),
            document.getElementById('sugestoes-destino'),
            (lat, lon, texto) => {
                pontosRota.destino = { lat, lon, texto };
                tentarAtualizarRota();
            }
        );

        // 4. Adicionar Paradas Dinamicamente
        function adicionarParada() {
            contadorParadas++;
            const idParada = `parada_${contadorParadas}`;
            
            const container = document.getElementById('paradas-container');
            
            const grupoDiv = document.createElement('div');
            grupoDiv.className = 'input-group';
            grupoDiv.id = `grupo_${idParada}`;
            grupoDiv.style.marginBottom = '10px';
            
            grupoDiv.innerHTML = `
                <label>Parada Extra (${contadorParadas})</label>
                <div class="input-row">
                    <input type="text" id="${idParada}" placeholder="Digite o endereço da parada..." autocomplete="off">
                    <button class="btn-acao btn-remover" onclick="removerParada('${idParada}')">X</button>
                </div>
                <div id="sugestoes_${idParada}" class="sugestoes-lista"></div>
            `;

            container.appendChild(grupoDiv);

            // Adiciona objeto na lista de paradas
            const novaParadaObj = { id: idParada, lat: null, lon: null, texto: '' };
            pontosRota.paradas.push(novaParadaObj);

            // Ativa autocomplete para o novo input criado
            configurarAutocomplete(
                document.getElementById(idParada),
                document.getElementById(`sugestoes_${idParada}`),
                (lat, lon, texto) => {
                    novaParadaObj.lat = lat;
                    novaParadaObj.lon = lon;
                    novaParadaObj.texto = texto;
                    tentarAtualizarRota();
                }
            );
        }

        function removerParada(idParada) {
            const elemento = document.getElementById(`grupo_${idParada}`);
            if (elemento) elemento.remove();

            // Remove do array de paradas
            pontosRota.paradas = pontosRota.paradas.filter(p => p.id !== idParada);
            tentarAtualizarRota();
        }

        // 5. Cálculo de Rota, Distância e Tarifa
        function tentarAtualizarRota() {
            // Verifica se temos pelo menos Embarque e Destino preenchidos com coordenadas
            if (!pontosRota.embarque || !pontosRota.destino) return;

            // Monta a lista de pontos na ordem correta: [Embarque, ...Paradas, Destino]
            let waypoints = [
                L.latLng(pontosRota.embarque.lat, pontosRota.embarque.lon)
            ];

            // Adiciona paradas intermediárias válidas
            pontosRota.paradas.forEach(p => {
                if (p.lat && p.lon) {
                    waypoints.push(L.latLng(p.lat, p.lon));
                }
            });

            // Adiciona destino final
            waypoints.push(L.latLng(pontosRota.destino.lat, pontosRota.destino.lon));

            // Remove rota anterior se já existir
            if (routingControl) {
                map.removeControl(routingControl);
            }

            // Cria a nova rota no mapa
            routingControl = L.Routing.control({
                waypoints: waypoints,
                language: 'pt',
                routeWhileDragging: false,
                addWaypoints: false,
                createMarker: function(i, wp, nWaypoints) {
                    let titulo = "Parada";
                    if (i === 0) titulo = "Embarque";
                    if (i === nWaypoints - 1) titulo = "Destino Final";
                    return L.marker(wp.latLng).bindPopup(titulo);
                }
            }).addTo(map);

            // Escuta o evento de cálculo concluído para pegar a distância real
            routingControl.on('routesfound', function(e) {
                const rota = e.routes[0];
                const distanciaKm = (rota.summary.totalDistance / 1000).toFixed(2); // Metros para KM
                const tempoMin = Math.round(rota.summary.totalTime / 60); // Segundos para Minutos

                // Regra de Negócio para o Cálculo da Tarifa:
                // Exemplo: Taxa fixa de R$ 5,00 + R$ 2,50 por quilômetro rodado + R$ 0,30 por minuto
                const taxaFixa = 5.00;
                const valorKm = 2.50;
                const valorMin = 0.30;

                const precoTotal = taxaFixa + (distanciaKm * valorKm) + (tempoMin * valorMin);

                // Exibe o painel de resumo
                document.getElementById('resumo-viagem').style.display = 'flex';
                document.getElementById('txt-distancia').innerText = `Distância: ${distanciaKm} km (~${tempoMin} min)`;
                document.getElementById('txt-preco').innerText = `Valor: R$ ${precoTotal.toFixed(2).replace('.', ',')}`;
            });
        }

        // 6. Solicitar Motorista
        function chamarMotorista() {
            if (!pontosRota.embarque || !pontosRota.destino) {
                alert("Por favor, selecione o local de embarque e o destino final válidos nas sugestões.");
                return;
            }

            const precoTexto = document.getElementById('txt-preco').innerText;
            alert(`Solicitação enviada com sucesso!\n${precoText}\nProcurando o motorista mais próximo...`);
        }
    </script>
</body>
</html>
